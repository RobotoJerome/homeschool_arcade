<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" rx="6" fill="#1b1840"/>
  <g fill="#fff"><rect x="4" y="5" width="1" height="1"/><rect x="26" y="8" width="1" height="1"/><rect x="7" y="22" width="1" height="1"/><rect x="25" y="25" width="1" height="1"/><rect x="21" y="3" width="1" height="1"/></g>
  <!-- flame -->
  <rect x="14" y="25" width="4" height="2" fill="#ffd23f"/><rect x="15" y="27" width="2" height="2" fill="#ff7a2f"/>
  <!-- fins -->
  <rect x="9" y="19" width="3" height="6" fill="#ff4d5e"/><rect x="20" y="19" width="3" height="6" fill="#ff4d5e"/>
  <rect x="8" y="22" width="1" height="3" fill="#1d1b33"/><rect x="23" y="22" width="1" height="3" fill="#1d1b33"/>
  <!-- body -->
  <rect x="12" y="9" width="8" height="15" fill="#f2f4fa"/>
  <rect x="11" y="10" width="1" height="14" fill="#1d1b33"/><rect x="20" y="10" width="1" height="14" fill="#1d1b33"/>
  <rect x="17" y="10" width="3" height="14" fill="#c6cbe0"/>
  <rect x="12" y="24" width="8" height="1" fill="#1d1b33"/>
  <!-- nose -->
  <rect x="13" y="6" width="6" height="3" fill="#ff4d5e"/><rect x="14" y="4" width="4" height="2" fill="#ff4d5e"/><rect x="15" y="3" width="2" height="1" fill="#ff4d5e"/>
  <!-- window -->
  <rect x="14" y="12" width="4" height="4" fill="#1d1b33"/><rect x="15" y="13" width="2" height="2" fill="#3fa9f5"/><rect x="15" y="13" width="1" height="1" fill="#bfe8ff"/>
  <!-- plus sign badge -->
  <rect x="24" y="14" width="6" height="2" fill="#ffd23f"/><rect x="26" y="12" width="2" height="6" fill="#ffd23f"/>
</svg>
